function renderAll() {
  renderStatuses(); renderBanner(); renderStrip(); renderFeed(); renderThread(); renderChat(); renderTitleBadge();
}

/* --------------------------- setup banner (auth) --------------------------- */

/** Copy to the clipboard, with a fallback that at least selects the text. */
function copyCommand(text, btn, cmdNode) {
  const ok = () => {
    btn.textContent = 'Copied';
    btn.classList.add('done');
    setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('done'); }, 1800);
  };
  const selectInstead = () => {
    try {
      const r = document.createRange();
      r.selectNodeContents(cmdNode);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(r);
    } catch (_) {}
    btn.textContent = 'Press ⌘C';
    setTimeout(() => { btn.textContent = 'Copy'; }, 2500);
  };
  const legacy = () => {
    try {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      const done = document.execCommand('copy');
      document.body.removeChild(ta);
      if (done) ok(); else selectInstead();
    } catch (_) { selectInstead(); }
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(ok, legacy);
  } else {
    legacy();
  }
}

// Rebuilt only when the situation changes, so the 5s poll never resets the
// "Copied" confirmation or a half-made text selection under the user's cursor.
let bannerSig = null;
function renderBanner() {
  const e = analyzerErr();
  const on = !!(e && e.kind === 'auth');
  // The command and the headline come from the server, which knows which AI harness is
  // configured. Hard-coding Claude's here told a Codex user to sign in to the wrong
  // product; render what we are given, and drop the command row when there is none.
  const cmd = on ? String(e.command || '') : '';
  const title = on ? String(e.message || '') : '';
  const sig = on ? 'auth:' + cmd + '|' + title : 'off';
  if (bannerSig === sig) return;
  bannerSig = sig;

  if (!on) {
    bannerEl.className = 'setupbanner';
    bannerEl.replaceChildren();
    return;
  }
  bannerEl.className = 'setupbanner on';

  const icon = el('div', 'sbicon', '●');
  const main = el('div', 'sbmain');
  main.appendChild(el('div', 'sbtitle',
    (title || "Claude isn't signed in") + " — items can't be prioritized yet."));
  main.appendChild(el('div', 'sbsub',
    'Your Slack messages are still arriving and nothing is lost. Until this is fixed, ' +
    'no message gets an urgency rating or a summary.'));

  if (cmd) {
    const row = el('div', 'cmdrow');
    row.appendChild(el('span', 'lead', 'Open Terminal and run:'));
    const cmdNode = el('code', 'cmd', cmd);
    cmdNode.title = 'click to select, then copy';
    row.appendChild(cmdNode);
    const copy = el('button', 'copybtn', 'Copy');
    copy.title = 'copy this command';
    copy.addEventListener('click', () => copyCommand(cmd, copy, cmdNode));
    row.appendChild(copy);
    main.appendChild(row);
  }

  main.appendChild(el('div', 'sbsub',
    'Then come back here — prioritizing starts again on its own within a few minutes, ' +
    'or use "Check this again" on a message to retry it straight away.'));

  bannerEl.replaceChildren(icon, main);
}

/** Plain-English state of one Slack workspace, from /api/status. */
function wsHealth(h) {
  if (!h || !h.registered || !h.state) return { cls: '', text: 'Still starting up…' };
  const detail = h.message ? ' — ' + h.message : '';
  if (h.state === 'connected') return { cls: 'ok', text: 'Connected' + detail };
  if (h.state === 'connecting') return { cls: 'warn', text: h.message || 'Connecting to Slack…' };
  if (h.state === 'reconnecting') {
    return { cls: 'warn', text: h.message || 'Lost the connection to Slack — trying again.' };
  }
  return { cls: 'err', text: h.message || "Can't connect to Slack right now." };
}

function renderStatuses() {
  const ws = new Map();
  state.items.forEach((i) => { if (!ws.has(i.workspace)) ws.set(i.workspace, i.team_name || i.workspace); });
  /* The feed only says which workspaces have sent us something; /api/status is the only
     honest source for "is Slack actually connected?". Prefer it — it also lists a
     configured workspace that has produced no messages yet — and fall back to the
     feed-derived names until the first status answer arrives. */
  const health = new Map();
  const reported = state.status && state.status.workspaces;
  if (Array.isArray(reported)) {
    reported.forEach((w) => {
      if (!w || !w.key) return;
      health.set(w.key, w);
      ws.set(w.key, w.teamName || ws.get(w.key) || w.key);
    });
  }
  const pending = state.items.filter((i) => !urgencyOf(i) && i.status !== 'done').length;
  statusesEl.replaceChildren();
  const chip = analyzerChip(pending);
  if (chip) statusesEl.appendChild(chip);
  ws.forEach((name, key) => {
    const s = el('span', 'st');
    const h = health.get(key);
    const hs = h ? wsHealth(h) : null;
    // No dot at all when the server has not reported yet: an uncoloured dot would read as
    // a bug, and a green one would be a claim we cannot back up.
    if (hs && hs.cls) s.appendChild(el('i', hs.cls));
    s.appendChild(wsBadge({ workspace: key, team_name: name }));
    s.appendChild(el('span', null, name));
    s.title = name + (hs ? ' — ' + hs.text : '');
    statusesEl.appendChild(s);
  });
  const ok = !state.feedError;
  const srv = el('span', 'st');
  const dot = el('i', ok ? 'ok' : 'err');
  srv.appendChild(dot);
  srv.appendChild(el('span', null, ok ? 'live' : 'offline'));
  srv.title = ok
    ? 'feed polling every ' + (POLL_MS / 1000) + 's — last update ' + (state.lastOk ? new Date(state.lastOk).toLocaleTimeString() : '—')
    : 'feed poll failing: ' + state.feedError;
  statusesEl.appendChild(srv);
  const hb = el('button', 'helpbtn', '?');
  hb.title = 'keyboard shortcuts';
  hb.addEventListener('click', () => toggleHelp(true));
  statusesEl.appendChild(hb);

  const { flat } = visibleItems();
  const unseen = state.items.filter((i) => i.status === 'new').length;
  document.getElementById('tab-count').textContent = unseen ? String(unseen) : '';
  document.getElementById('legend-note').textContent =
    flat.length + (flat.length === 1 ? ' thread' : ' threads') +
    (state.lastOk ? ' · updated ' + new Date(state.lastOk).toLocaleTimeString() : '');
}

/** Top-bar health of the background worker: idle / prioritizing n / stopped.
 *  Falls back to the old client-side count until /api/status has answered. */
function analyzerChip(pendingFallback) {
  const a = analyzerInfo();
  if (!a) {
    return pendingFallback ? el('span', 'queue', 'Claude · ' + pendingFallback + ' waiting') : null;
  }
  const queued = typeof a.queued === 'number' ? a.queued : pendingFallback;
  const trouble = analyzerTrouble();
  if (trouble) {
    const cls = trouble.kind === 'off' ? 'queue warnq' : 'queue errq';
    const label =
      trouble.kind === 'auth' ? 'Claude · not signed in'
        : trouble.kind === 'off' ? 'Claude · prioritizing off'
          : 'Claude · paused';
    const c = el('span', cls, label);
    c.title = trouble.message + ' — ' + trouble.hint +
      (queued ? '\n' + queued + ' message' + (queued === 1 ? '' : 's') + ' waiting.' : '');
    return c;
  }
  if (a.state === 'analyzing') {
    const c = el('span', 'queue busy', 'Claude · prioritizing' + (queued > 1 ? ' ' + queued : ''));
    c.title = 'Reading a message now' + (queued > 1 ? ', ' + (queued - 1) + ' behind it.' : '.');
    return c;
  }
  if (queued > 0) {
    const c = el('span', 'queue', 'Claude · ' + queued + ' waiting');
    c.title = 'Claude looks at a message about 45 seconds after the last reply lands.';
    return c;
  }
  const c = el('span', 'queue', 'Claude · up to date');
  c.title = a.lastOk ? 'Last message prioritized ' + (agoFromIso(a.lastOk) || 'recently') + '.'
    : 'Nothing waiting to be prioritized.';
  return c;
}

function renderStrip() {
  if (stripFlash) {
    stripEl.className = 'strip on' + (stripFlash.tone === 'info' ? ' info' : '');
    stripEl.textContent = (stripFlash.tone === 'info' ? '' : '⚠ ') + stripFlash.msg;
    return;
  }
  if (state.feedError) {
    stripEl.className = 'strip on err';
    stripEl.textContent = '⚠ Feed refresh failed (' + state.feedError + ') — showing last known data' +
      (state.lastOk ? ', updated ' + new Date(state.lastOk).toLocaleTimeString() : '') + '. Retrying…';
    return;
  }
  // Analyzer trouble is ambient here — except the sign-in case, which gets the
  // banner above instead (it needs a command the user can copy).
  const trouble = analyzerTrouble();
  if (trouble && trouble.kind !== 'auth') {
    // amber for the faults that clear themselves, red for the ones that may not
    const selfHealing = trouble.kind === 'rate_limit' || trouble.kind === 'timeout' ||
      trouble.kind === 'bad_output' || trouble.kind === 'off';
    stripEl.className = 'strip on' + (selfHealing ? '' : ' err');
    stripEl.textContent = '⚠ ' + trouble.message + ' — ' + trouble.hint;
    return;
  }
  stripEl.className = 'strip';
  stripEl.textContent = '';
}

function skeletonFeed() {
  const frag = document.createDocumentFragment();
  for (let i = 0; i < 4; i++) {
    const s = el('div', 'skel');
    s.appendChild(el('div')).style.width = '40%';
    s.appendChild(el('div')).style.width = '85%';
    s.appendChild(el('div')).style.width = '65%';
    frag.appendChild(s);
  }
  return frag;
}

function cardFor(it) {
  let c = cardEls.get(it.id);
  if (!c) {
    c = el('div', 'card');
    c.dataset.id = String(it.id);
    c.appendChild(el('div', 'crow1'));
    c.appendChild(el('div', 'crow2'));
    c.appendChild(el('div', 'crow3'));
    c.addEventListener('click', (e) => {
      if (e.target.closest('.hbtn')) return;
      setCursor(it.id, { markSeen: true });   // mouse click = engage
      state.focusPane = 'feed';
    });
    cardEls.set(it.id, c);
  }
  const u = urgencyOf(it);
  const stale = isStale(it);
  const sig = JSON.stringify([u, it.status, it.why, it.last_activity, it.channel_name, it.kind,
    it.last_message && it.last_message.author_name, it.last_message && it.last_message.text,
    stale, staleCount(it), it.team_name, state.cursor === it.id, analyzerStalled()]);
  if (c.dataset.sig !== sig) {
    c.dataset.sig = sig;
    paintCard(c, it, u, stale);
  }
  c.classList.toggle('sel', state.cursor === it.id);
  return c;
}

function paintCard(c, it, u, stale) {
  c.className = 'card' + (u ? ' ' + u.toLowerCase() : '') +
    (it.status === 'seen' ? ' seen' : '') + (it.status === 'done' ? ' done' : '') +
    (stale ? ' stale' : '');

  const r1 = c.children[0], r2 = c.children[1], r3 = c.children[2];
  r1.replaceChildren(); r2.replaceChildren(); r3.replaceChildren();

  if (u) {
    const chip = el('span', 'chip c' + u.charAt(1), u);
    chip.title = 'urgency ' + u;
    r1.appendChild(chip);
  } else {
    const chip = el('span', 'chip pending', '…');
    const trouble = analyzerTrouble();
    chip.title = trouble ? trouble.message + ' — ' + trouble.hint : 'not prioritized yet';
    r1.appendChild(chip);
  }
  if (stale) {
    const n = staleCount(it);
    const s = el('span', 'stale-mark', '↻');
    s.title = n ? n + (n === 1 ? ' new reply' : ' new replies') + ' since analysis' : 'new replies since analysis';
    r1.appendChild(s);
  }
  r1.appendChild(wsBadge(it));
  r1.appendChild(el('span', 'chan', channelLabel(it)));
  if (it.kind === 'mention') r1.appendChild(el('span', 'kind', '@'));
  const t = el('span', 'ctime', relTime(it.last_activity));
  t.title = it.last_activity ? new Date(tsMs(it.last_activity)).toLocaleString() : '';
  r1.appendChild(t);

  const hb = el('span', 'hoverbtns');
  const done = el('button', 'hbtn', it.status === 'done' ? '↺' : '✓');
  done.title = it.status === 'done' ? 'reopen' : 'mark done (e)';
  done.addEventListener('click', (e) => {
    e.stopPropagation();
    if (it.status === 'done') setStatus(it.id, 'new'); else markDoneAndAdvance(it.id);
  });
  hb.appendChild(done);
  const slack = el('button', 'hbtn', '↗');
  slack.title = httpUrlOrNull(it.permalink) ? 'open in Slack (s)' : 'no link back to Slack';
  slack.addEventListener('click', (e) => { e.stopPropagation(); openInSlack(it.id); });
  hb.appendChild(slack);
  r1.appendChild(hb);

  r2.appendChild(el('span', 'udot'));
  r2.appendChild(el('span', 'ddone', '✓'));
  const lm = it.last_message;
  r2.appendChild(el('span', 'sender', (lm && lm.author_name) || 'unknown'));
  r2.appendChild(el('span', 'snippet', plainText(lm && lm.text, null) || '—'));

  r3.appendChild(el('span', 'spark', '✦'));
  if (it.why) {
    const w = el('span', 'why', it.why);
    w.title = it.why;
    r3.appendChild(w);
  } else if (analyzerStalled()) {
    // Never shimmer when nothing is running — that reads as "work in progress".
    const trouble = analyzerTrouble();
    const w = el('span', 'why waiting', 'Waiting to be prioritized');
    w.title = trouble ? trouble.message + ' — ' + trouble.hint : 'Waiting to be prioritized';
    r3.appendChild(w);
  } else {
    r3.appendChild(el('span', 'why shimmer', 'Analyzing…'));
  }
}

function renderFeed() {
  if (!state.loaded && !state.items.length) {
    if (state.feedError) {
      const p = el('div', 'placeholder');
      p.innerHTML = html`<b>Can't reach your messages</b>Slack Copilot isn't answering (${state.feedError}).<br>Retrying every ${POLL_MS / 1000} seconds. If this stays, quit and reopen the app.`;
      feedListEl.replaceChildren(p);
    } else {
      feedListEl.replaceChildren(skeletonFeed());
    }
    return;
  }
  const { pending, ranked, flat, grouped } = visibleItems();
  if (!flat.length) {
    const names = Array.from(new Set(state.items.map((i) => i.team_name).filter(Boolean)));
    const p = el('div', 'placeholder');
    p.innerHTML = state.tab === 'done'
      ? html`<b>Nothing done yet</b>Press <span class="kbd">e</span> on a thread to file it here.`
      : html`<b>No DMs or mentions yet</b>${names.length ? 'Watching ' + names.join(' + ') + '.' : 'Watching your Slack workspaces.'}<br>New threads land here the moment they arrive.`;
    feedListEl.replaceChildren(p);
    return;
  }

  // keep the cursored card visually anchored across live re-sorts
  const selBefore = cardEls.get(state.cursor);
  const topBefore = selBefore && selBefore.isConnected ? selBefore.getBoundingClientRect().top : null;

  const frag = document.createDocumentFragment();
  // Grouping is a priority-mode affordance only; see visibleItems().
  if (grouped && pending.length) {
    const g = el('div', 'group-label');
    if (analyzerStalled()) {
      g.appendChild(el('span', null, 'Waiting to be prioritized · ' + pending.length));
      const trouble = analyzerTrouble();
      if (trouble) g.title = trouble.message + ' — ' + trouble.hint;
    } else {
      g.appendChild(el('span', 'spin', '…'));
      g.appendChild(el('span', null, 'Analyzing · ' + pending.length));
    }
    frag.appendChild(g);
    pending.forEach((it) => frag.appendChild(cardFor(it)));
  }
  if (ranked.length) {
    frag.appendChild(el('div', 'group-label', feedGroupLabel()));
    ranked.forEach((it) => frag.appendChild(cardFor(it)));
  }
  feedListEl.replaceChildren(frag);

  // one 300ms pulse for genuinely new arrivals
  const first = state.knownIds.size === 0;
  flat.forEach((it) => {
    if (!state.knownIds.has(it.id)) {
      state.knownIds.add(it.id);
      if (!first) {
        const c = cardEls.get(it.id);
        if (c) { c.classList.add('pulse'); setTimeout(() => c.classList.remove('pulse'), 320); }
      }
    }
  });
  cardEls.forEach((_, id) => { if (!state.items.some((i) => i.id === id)) cardEls.delete(id); });

  if (topBefore !== null) {
    const selAfter = cardEls.get(state.cursor);
    if (selAfter && selAfter.isConnected) {
      feedListEl.scrollTop += selAfter.getBoundingClientRect().top - topBefore;
    }
  }
}

function scrollCursorIntoView() {
  const c = cardEls.get(state.cursor);
  if (c && c.isConnected) c.scrollIntoView({ block: 'nearest' });
}

/* ------------------------------- thread ---------------------------------- */

function renderThread() {
  const it = itemById(state.cursor);
  if (!it) {
    if (threadEl.dataset.sig === 'none') return;
    threadEl.dataset.sig = 'none';
    const p = el('div', 'placeholder');
    p.innerHTML = html`<b>Select a thread</b><span class="kbd">j</span> / <span class="kbd">k</span> to move · <span class="kbd">enter</span> to open`;
    threadEl.replaceChildren(p);
    return;
  }
  const d = state.detail && state.detail.id === it.id ? state.detail : null;
  const a = d ? d.analysis : null;

  // The 5s poll re-renders everything; rebuilding an unchanged transcript would
  // reset its scroll and steal focus mid-read. Only rebuild on a real change
  // (the minute bucket keeps "analyzed 6m ago" honest).
  const sig = JSON.stringify([it.id, it.status, it.last_activity, it.permalink, it.message_count,
    d ? d.messages.length : -1, d && d.messages.length ? d.messages[d.messages.length - 1].ts : null,
    a && [a.urgency, a.why, a.summary, a.suggested_action, a.context_notes, a.covered_through_ts, a.analyzed_at],
    state.detailLoading, state.detailError, collapsedSet().has(it.id), Math.floor(Date.now() / 60000),
    analyzerSig(), state.reanalyze.get(it.id) || null, handoffSig(it.id)]);
  if (threadEl.dataset.sig === sig) return;
  threadEl.dataset.sig = sig;

  const old = document.getElementById('tscroll');
  const keepTop = old ? old.scrollTop : 0;
  const hadFocus = old && document.activeElement === old;

  const names = {};
  if (d) d.messages.forEach((m) => { if (m.author_id && m.author_name) names[m.author_id] = m.author_name; });

  threadEl.replaceChildren(threadHeader(it, d), threadScroll(it, d, a, names));

  const next = document.getElementById('tscroll');
  if (next) {
    next.scrollTop = keepTop;
    if (hadFocus || state.focusPane === 'thread') next.focus({ preventScroll: true });
  }
}

function threadHeader(it, d) {
  const h = el('div', 'thead');
  h.appendChild(wsBadge(it));
  h.appendChild(el('span', 'title', channelLabel(it)));
  const bits = [it.kind === 'mention' ? 'mention' : 'DM', it.team_name || it.workspace];
  const n = d ? d.messages.length : it.message_count;
  bits.push(n + (n === 1 ? ' message' : ' messages'));
  if (it.last_activity) bits.push('updated ' + clockTime(it.last_activity));
  h.appendChild(el('span', 'sub', bits.join(' · ')));

  const act = el('div', 'tactions');
  const chat = el('button', 'btn primary');
  chat.appendChild(document.createTextNode('Discuss with Claude'));
  chat.appendChild(el('span', 'key', 'c'));
  chat.addEventListener('click', () => openChat(it.id, ''));
  act.appendChild(chat);

  const slack = el('button', 'btn');
  slack.appendChild(document.createTextNode('Open in Slack'));
  slack.appendChild(el('span', 'key', 's'));
  slack.disabled = !httpUrlOrNull(it.permalink);
  if (slack.disabled) slack.title = 'this conversation has no link back to Slack';
  slack.addEventListener('click', () => openInSlack(it.id));
  act.appendChild(slack);

  const done = el('button', 'btn');
  done.appendChild(document.createTextNode(it.status === 'done' ? 'Reopen' : 'Done'));
  if (it.status !== 'done') done.appendChild(el('span', 'key', 'e'));
  done.addEventListener('click', () => {
    if (it.status === 'done') setStatus(it.id, 'new'); else markDoneAndAdvance(it.id);
  });
  act.appendChild(done);

  const more = el('button', 'btn', '⋯');
  more.title = 'more actions';
  more.addEventListener('click', (e) => {
    e.stopPropagation();
    const open = act.querySelector('.menu');
    if (open) { open.remove(); return; }
    const menu = el('div', 'menu');
    const unseen = el('button', null, 'Mark unseen (u)');
    unseen.addEventListener('click', () => { setStatus(it.id, 'new'); menu.remove(); });
    menu.appendChild(unseen);
    const re = el('button', null, reanalyzeLabel(it.id, 'Check this again'));
    const busy = !!state.reanalyze.get(it.id);
    re.disabled = busy;
    re.title = busy
      ? 'already asked — Claude will pick this up shortly'
      : 'ask Claude to look at this message again now';
    re.addEventListener('click', () => { reanalyze(it.id); menu.remove(); });
    menu.appendChild(re);
    act.appendChild(menu);
    setTimeout(() => document.addEventListener('click', function off() {
      menu.remove(); document.removeEventListener('click', off);
    }, { once: true }), 0);
  });
  act.appendChild(more);
  h.appendChild(act);
  return h;
}

function threadScroll(it, d, a, names) {
  const scroll = el('div', 'tscroll');
  scroll.id = 'tscroll';
  scroll.tabIndex = -1;
  const body = el('div', 'tbody');

  body.appendChild(analysisCard(it, d, a));
  const handoff = handoffCard(it);
  if (handoff) body.appendChild(handoff);

  if (!d) {
    body.appendChild(el('div', 'placeholder',
      state.detailError ? 'Could not load this thread (' + state.detailError + ') — retrying on the next poll.' : 'Loading transcript…'));
    scroll.appendChild(body);
    return scroll;
  }

  const covered = a && a.covered_through_ts ? parseFloat(a.covered_through_ts) : null;
  let lastDay = null, prev = null, staleShown = false;
  d.messages.forEach((m) => {
    let breakGroup = false;
    const day = startOfDay(tsMs(m.ts));
    if (day !== lastDay) {
      body.appendChild(el('div', 'divider', dayLabel(m.ts)));
      lastDay = day; breakGroup = true;
    }
    if (covered !== null && !staleShown && parseFloat(m.ts) > covered + 0.0001) {
      body.appendChild(el('div', 'divider stale-div', 'new since last analysis'));
      staleShown = true; breakGroup = true;
    }
    const same = !breakGroup && prev && prev.author_id === m.author_id &&
      Math.abs(tsMs(m.ts) - tsMs(prev.ts)) < 300000;

    const row = el('div', 'msg' + (same ? '' : ' first'));
    const author = m.author_name || m.author_id || 'unknown';
    if (same) {
      row.appendChild(el('div', 'avatar ghost'));
      const b = el('div', 'mbody');
      const txt = el('div', 'mtext');
      txt.appendChild(renderMrkdwn(m.text, names));
      b.appendChild(txt);
      row.appendChild(b);
    } else {
      row.appendChild(el('div', 'avatar', initials(author)));
      const b = el('div', 'mbody');
      const head = el('div', 'mhead');
      head.appendChild(el('span', 'mauthor', author));
      const tm = el('span', 'mtime', clockTime(m.ts));
      tm.title = new Date(tsMs(m.ts)).toLocaleString();
      head.appendChild(tm);
      b.appendChild(head);
      const txt = el('div', 'mtext');
      txt.appendChild(renderMrkdwn(m.text, names));
      b.appendChild(txt);
      row.appendChild(b);
    }
    body.appendChild(row);
    prev = m;
  });

  if (!d.messages.length) body.appendChild(el('div', 'placeholder', 'No messages stored for this thread yet.'));

  const cta = el('div', 'endcta');
  cta.appendChild(document.createTextNode('End of thread · '));
  const b = el('button', null, 'Discuss with Claude');
  b.addEventListener('click', () => openChat(it.id, ''));
  cta.appendChild(b);
  cta.appendChild(el('span', 'key', 'c'));
  body.appendChild(cta);

  scroll.appendChild(body);
  return scroll;
}

/**
 * "Continue in Claude Code" — nothing at all until the server says there is a
 * session to continue, so the card never advertises a button that cannot work.
 */
function handoffCard(it) {
  const h = state.handoff.get(it.id);
  if (!h || !h.loaded) return null;
  if (!h.chat && !h.analysis) return null;

  const card = el('div', 'hocard');
  card.appendChild(el('div', 'hotitle', 'Continue in Claude Code'));
  card.appendChild(el('div', 'hosub',
    'Pick this conversation back up in the terminal, where Claude can use its tools and ' +
    'actually go and change things — not just draft a reply.'));

  let first = true;
  const item = (target, label, describe, warn) => {
    const slot = h[target];
    if (!slot) return;
    const wrap = el('div', 'hoitem' + (first ? ' first' : ''));
    first = false;
    wrap.appendChild(el('div', 'holabel', label));
    wrap.appendChild(el('div', 'hosub', describe));
    if (warn) wrap.appendChild(el('div', 'howarn', warn));

    if (h.canLaunch) {
      const b = el('button', 'hobtn', h.busy === target ? 'Opening…' : 'Open in Claude Code');
      b.disabled = !!h.busy;
      b.addEventListener('click', () => openInClaudeCode(it.id, target));
      const row = el('div', 'cmdrow');
      row.appendChild(b);
      wrap.appendChild(row);
    }
    // The outcome belongs to the button that produced it, and "…run this yourself"
    // has to come BEFORE the command it introduces or it captions nothing.
    const mine = h.note && h.note.target === target && h.busy === null;
    const note = mine ? el('div', 'honote ' + h.note.tone, h.note.text) : null;
    if (note && h.note.tone === 'bad') wrap.appendChild(note);
    if (!h.canLaunch || h.shown[target]) wrap.appendChild(commandRow(slot.command));
    if (note && h.note.tone === 'good') wrap.appendChild(note);
    card.appendChild(wrap);
  };

  item('chat', 'Continue this chat',
    'Reopens the side-panel conversation exactly where you left it.');
  item('analysis', 'See why it was rated this way',
    'Reopens the session that gave this message its urgency and summary.',
    'Heads-up: that session was told to answer only with a rating, so its first reply will ' +
    'look like raw data. Ask it to talk normally and it will.');

  return card;
}

function initials(name) {
  const parts = String(name || '?').trim().split(/\s+/).filter(Boolean);
  if (!parts.length) return '?';
  if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
  return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
}

const COLLAPSE_KEY = 'copilot-analysis-collapsed';
function collapsedSet() {
  try { return new Set(JSON.parse(sessionStorage.getItem(COLLAPSE_KEY) || '[]')); }
  catch (_) { return new Set(); }
}
function setCollapsed(id, on) {
  const s = collapsedSet();
  if (on) s.add(id); else s.delete(id);
  try { sessionStorage.setItem(COLLAPSE_KEY, JSON.stringify(Array.from(s))); } catch (_) {}
}

function parseNotes(s) {
  return String(s || '').split('\n').map((l) => l.trim()).filter(Boolean).map((l) => {
    const m = /^[-•*]?\s*\[([^\]]{1,32})\]\s*(.*)$/.exec(l);
    return m ? { source: m[1], text: m[2] } : { source: null, text: l.replace(/^[-•*]\s*/, '') };
  });
}

function analysisCard(it, d, a) {
  const card = el('div', 'analysis');
  const collapsed = collapsedSet().has(it.id);
  if (collapsed) card.classList.add('collapsed');

  if (!a) {
    card.classList.add('pending');
    const trouble = analyzerTrouble();
    const stalled = analyzerStalled() && !!trouble;
    const body = el('div', 'abody');
    const why = el('div', 'awhy');
    why.appendChild(el('span', 'chip pending', '…'));
    why.appendChild(el('span', 'whytext',
      !d ? 'Loading…' : stalled ? 'Waiting to be prioritized' : 'Analyzing this thread…'));
    body.appendChild(why);
    if (stalled) {
      // Say what is actually happening instead of animating a skeleton at someone.
      const s = el('div', 'asec');
      s.appendChild(el('b', null, trouble.message));
      s.appendChild(document.createTextNode(' — ' + trouble.hint));
      body.appendChild(s);
      body.appendChild(el('div', 'asec',
        'The message itself is safe and the conversation below is complete. Only the urgency ' +
        'rating and summary are missing.'));
    } else {
      [70, 92, 55].forEach((w) => { const s = el('div', 'askel'); s.style.width = w + '%'; body.appendChild(s); });
    }
    card.appendChild(body);
    const meta = el('div', 'ameta');
    meta.appendChild(el('span', null, stalled
      ? 'it keeps its place in the list until Claude can rate it'
      : 'Claude picks threads up ~45s after the last message'));
    meta.appendChild(reanalyzeControl(it.id));
    card.appendChild(meta);
    return card;
  }

  const stale = isStale(it);
  if (stale) {
    const n = staleCount(it);
    card.appendChild(el('div', 'stalebanner',
      '⚠ ' + (n ? n + (n === 1 ? ' new reply' : ' new replies') : 'New replies') + ' since Claude last read this — checking it again…'));
  }

  const body = el('div', 'abody');
  const why = el('div', 'awhy');
  const u = RANK[a.urgency] !== undefined ? a.urgency : null;
  why.appendChild(u ? el('span', 'chip c' + u.charAt(1), u) : el('span', 'chip pending', '…'));
  why.appendChild(el('span', 'whytext', a.why || 'No summary line returned.'));
  const chev = el('button', 'chev', collapsed ? '▸' : '▾');
  chev.title = collapsed ? 'expand analysis' : 'collapse analysis';
  chev.addEventListener('click', () => { setCollapsed(it.id, !collapsed); renderThread(); });
  why.appendChild(chev);
  body.appendChild(why);

  if (a.summary) {
    const s = el('div', 'asec');
    s.appendChild(el('b', null, 'Summary'));
    s.appendChild(document.createTextNode(' — ' + a.summary));
    body.appendChild(s);
  }
  if (a.suggested_action) {
    const row = el('div', 'asec action-row');
    const span = el('span');
    span.appendChild(el('b', null, 'Suggested action'));
    span.appendChild(document.createTextNode(' — ' + a.suggested_action));
    row.appendChild(span);
    const btn = el('button', 'draftbtn', 'Draft this reply →');
    btn.addEventListener('click', () => openChat(it.id, 'Draft the suggested reply.'));
    row.appendChild(btn);
    body.appendChild(row);
  }
  const notes = parseNotes(a.context_notes);
  if (notes.length) {
    const s = el('div', 'asec');
    s.appendChild(el('b', null, 'Context'));
    const ul = el('ul', 'ctx');
    notes.forEach((n) => {
      const li = el('li');
      if (n.source) li.appendChild(el('span', 'src', n.source));
      li.appendChild(document.createTextNode(n.text));
      ul.appendChild(li);
    });
    s.appendChild(ul);
    body.appendChild(s);
  }
  card.appendChild(body);

  const meta = el('div', 'ameta');
  const ago = agoFromIso(a.analyzed_at);
  meta.appendChild(el('span', null, 'Claude read this ' + (ago || 'at an unknown time')));
  if (a.covered_through_ts) meta.appendChild(el('span', null, '· up to the ' + clockTime(a.covered_through_ts) + ' message'));
  meta.appendChild(reanalyzeControl(it.id));
  card.appendChild(meta);
  return card;
}

/** The "· re-analyze" affordance in an analysis card's meta row. */
function reanalyzeControl(id) {
  const st = state.reanalyze.get(id);
  if (st) return el('span', 'muted-link', '· ' + (st === 'busy' ? 'asking Claude…' : 'queued ✓'));
  const re = el('button', 'metabtn', '· check this again');
  re.title = 'ask Claude to look at this message again now';
  re.addEventListener('click', (e) => { e.stopPropagation(); reanalyze(id); });
  return re;
}

/* -------------------------------- chat ----------------------------------- */

function openChat(id, seed) {
  if (id != null && id !== state.cursor) setCursor(id, { markSeen: true });
  else if (id != null) { const it = itemById(id); if (it && it.status === 'new') setStatus(id, 'seen'); }
  state.chatOpen = true;
  state.chatSeed = seed || state.chatSeed;
  state.focusPane = 'chat';
  document.body.classList.remove('chat-closed');
  renderChat();
  const ta = document.getElementById('composer');
  if (ta) { if (seed) ta.value = seed; ta.focus(); }
}
function closeChat() {
  state.chatOpen = false;
  state.chatSeed = '';
  state.chatNote = '';
  document.body.classList.add('chat-closed');
  state.focusPane = 'thread';
  renderChat();
}

function renderChat() {
  if (!state.chatOpen) {
    if (chatEl.dataset.sig !== 'closed') { chatEl.dataset.sig = 'closed'; chatEl.replaceChildren(); }
    return;
  }
  const it = itemById(state.cursor);
  // same reasoning as renderThread: never rebuild the composer under the user's cursor
  const sig = JSON.stringify([it ? it.id : null, it ? channelLabel(it) : null, state.chatNote, !!state.chatSeed]);
  if (chatEl.dataset.sig === sig) return;
  chatEl.dataset.sig = sig;
  const hadFocus = document.activeElement && document.activeElement.id === 'composer';
  const caret = hadFocus ? document.activeElement.selectionStart : null;
  const head = el('div', 'chead');
  head.appendChild(el('span', 'who', 'Claude — ' + (it ? channelLabel(it) : 'no thread')));
  const sess = el('span', 'sess');
  sess.appendChild(el('i'));
  sess.appendChild(el('span', null, 'no session'));
  sess.title = 'sessions arrive with the chat step';
  head.appendChild(sess);
  const x = el('button', 'cclose', '×');
  x.title = 'close (esc)';
  x.addEventListener('click', closeChat);
  head.appendChild(x);

  const body = el('div', 'cbody');
  body.appendChild(el('div', 'sysnote', '— chat is not wired up yet —'));
  const info = el('div', 'chatinfo');
  info.innerHTML = html`<h4>What lands here</h4>A Claude Code session scoped to <b>${it ? channelLabel(it) : 'the selected thread'}</b>, seeded with the transcript and the analysis above.
    <ul>
      <li>streaming replies with inline MCP tool rows</li>
      <li>a draft-reply card that only posts when you click send</li>
      <li>one resumable session per thread</li>
    </ul>`;
  body.appendChild(info);
  if (state.chatSeed) {
    body.appendChild(el('div', 'sysnote', 'seeded prompt kept in the composer below'));
  }
  if (state.chatNote) body.appendChild(el('div', 'sysnote', state.chatNote));

  const comp = el('div', 'composer');
  const ta = el('textarea');
  ta.id = 'composer';
  ta.placeholder = 'Message Claude about this thread…';
  ta.value = state.chatSeed || '';
  ta.addEventListener('input', () => { state.chatSeed = ta.value; });
  ta.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); notWired(); }
    if (e.key === 'Escape') { e.preventDefault(); closeChat(); }
  });
  comp.appendChild(ta);
  const row = el('div', 'crow');
  const send = el('button', 'csend', 'Send');
  send.disabled = true;
  send.title = 'the chat endpoint does not exist yet';
  row.appendChild(send);
  row.appendChild(el('span', 'chint', 'enter to send · shift+enter newline'));
  row.appendChild(el('span', 'cnote', 'Chat arrives with the Claude session step — nothing is sent yet.'));
  comp.appendChild(row);

  chatEl.replaceChildren(head, body, comp);
  if (hadFocus) {
    ta.focus();
    if (caret != null) { try { ta.setSelectionRange(caret, caret); } catch (_) {} }
  }
}
function notWired() {
  state.chatNote = 'Not sent — this panel is a shell until the Claude session endpoint exists.';
  renderChat();
  const ta = document.getElementById('composer');
  if (ta) ta.focus();
}

/* --------------------------- title + favicon ----------------------------- */

let badgeAt = 0, badgeTimer = null;
function renderTitleBadge() {
  const now = Date.now();
  if (now - badgeAt < 1000) {
    clearTimeout(badgeTimer);
    badgeTimer = setTimeout(renderTitleBadge, 1000 - (now - badgeAt));
    return;
  }
  badgeAt = now;
  const unseen = state.items.filter((i) => i.status === 'new' && (i.urgency === 'P0' || i.urgency === 'P1'));
  const p0 = unseen.some((i) => i.urgency === 'P0');
  const n = unseen.length;
  document.title = n ? '(' + n + (p0 ? '!' : '') + ') Slack Copilot' : 'Slack Copilot';
  drawFavicon(n, p0);
}

let faviconLink = null;
function drawFavicon(count, p0) {
  const c = document.createElement('canvas');
  c.width = 32; c.height = 32;
  const g = c.getContext('2d');
  if (!g) return;
  g.fillStyle = '#151b23';
  roundRect(g, 0, 0, 32, 32, 7); g.fill();
  g.strokeStyle = '#4c8dff'; g.lineWidth = 3; g.lineCap = 'round';
  g.beginPath(); g.moveTo(7, 20); g.quadraticCurveTo(16, 27, 25, 20); g.stroke();
  g.fillStyle = '#4c8dff';
  g.beginPath(); g.arc(11, 12, 2, 0, Math.PI * 2); g.fill();
  g.beginPath(); g.arc(21, 12, 2, 0, Math.PI * 2); g.fill();
  if (count > 0) {
    g.fillStyle = p0 ? '#f85149' : '#f0883e';
    g.beginPath(); g.arc(24, 8, 8, 0, Math.PI * 2); g.fill();
    g.fillStyle = '#0d1117';
    g.font = 'bold 11px -apple-system, sans-serif';
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(count > 9 ? '9+' : String(count), 24, 8.5);
  }
  if (!faviconLink) {
    faviconLink = document.createElement('link');
    faviconLink.rel = 'icon';
    document.head.appendChild(faviconLink);
  }
  faviconLink.href = c.toDataURL('image/png');
}
function roundRect(g, x, y, w, h, r) {
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r);
  g.closePath();
}

/* ------------------------------- help ------------------------------------ */

const SHORTCUTS = [
  ['j / ↓', 'Move cursor down — previews, does not mark seen'],
  ['k / ↑', 'Move cursor up'],
  ['enter / o', 'Open: mark seen and focus the thread pane'],
  ['e', 'Mark done and advance'],
  ['u', 'Mark unseen'],
  ['c', 'Open the Claude chat panel (marks seen)'],
  ['s', 'Open the thread in Slack (never changes status)'],
  ['shift + S', 'Change the order: Priority → Newest → Oldest (same as the buttons above the list)'],
  ['esc', 'Close chat → focus thread → focus feed'],
  ['1 / 2 / 3', 'Inbox / Done / All'],
  ['?', 'This overlay'],
];
function toggleHelp(on) {
  const card = document.getElementById('helpcard');
  if (on) {
    const frag = document.createDocumentFragment();
    const h = el('h3', null, 'Keyboard');
    h.appendChild(el('span', null, 'esc or ? to close'));
    frag.appendChild(h);
    SHORTCUTS.forEach(([k, v]) => {
      const r = el('div', 'helprow');
      r.appendChild(el('kbd', null, k));
      r.appendChild(el('span', null, v));
      frag.appendChild(r);
    });
    frag.appendChild(el('div', 'helpsec',
      'j/k deliberately do not mark threads seen — the tab badge only counts unseen P0/P1, so skimming never clears it.'));
    card.replaceChildren(frag);
  }
  overlayEl.classList.toggle('on', !!on);
}
overlayEl.addEventListener('click', () => toggleHelp(false));

/* ------------------------------ keyboard --------------------------------- */

document.addEventListener('keydown', (e) => {
  const tag = e.target && e.target.tagName;
  const typing = tag === 'TEXTAREA' || tag === 'INPUT' || (e.target && e.target.isContentEditable);
  if (e.metaKey || e.ctrlKey || e.altKey) return;

  if (overlayEl.classList.contains('on')) {
    if (e.key === 'Escape' || e.key === '?') { e.preventDefault(); toggleHelp(false); }
    return;
  }
  if (typing) return;   // the composer handles its own keys

  switch (e.key) {
    case 'j': advanceCursor(1); state.focusPane = 'feed'; e.preventDefault(); break;
    case 'k': advanceCursor(-1); state.focusPane = 'feed'; e.preventDefault(); break;
    case 'ArrowDown': if (state.focusPane === 'feed') { advanceCursor(1); e.preventDefault(); } break;
    case 'ArrowUp': if (state.focusPane === 'feed') { advanceCursor(-1); e.preventDefault(); } break;
    case 'Enter':
    case 'o': {
      if (state.cursor == null) break;
      const it = itemById(state.cursor);
      if (it && it.status === 'new') setStatus(it.id, 'seen');
      state.focusPane = 'thread';
      const s = document.getElementById('tscroll');
      if (s) s.focus();
      e.preventDefault();
      break;
    }
    case 'e': if (state.cursor != null) { markDoneAndAdvance(state.cursor); e.preventDefault(); } break;
    case 'u': if (state.cursor != null) { setStatus(state.cursor, 'new'); e.preventDefault(); } break;
    case 'c': if (state.cursor != null) { openChat(state.cursor, ''); e.preventDefault(); } break;
    case 's': if (state.cursor != null) { openInSlack(state.cursor); e.preventDefault(); } break;
    // shift+S cycles the order. Distinct from 's' (open in Slack) because the
    // switch matches e.key, and no other binding uses a capital letter.
    case 'S': cycleSort(); e.preventDefault(); break;
    case 'Escape':
      if (state.chatOpen) closeChat();
      else if (state.focusPane === 'thread') { state.focusPane = 'feed'; document.activeElement && document.activeElement.blur(); }
      e.preventDefault();
      break;
    case '1': switchTab('inbox'); e.preventDefault(); break;
    case '2': switchTab('done'); e.preventDefault(); break;
    case '3': switchTab('all'); e.preventDefault(); break;
    case '?': toggleHelp(true); e.preventDefault(); break;
    default: break;
  }
});

function switchTab(tab) {
  if (state.tab === tab) return;
  state.tab = tab;
  document.querySelectorAll('.tab').forEach((t) => t.classList.toggle('active', t.dataset.tab === tab));
  state.cursor = null;
  ensureCursor();
  renderFeed(); renderStatuses(); renderThread();
}
document.getElementById('tabs').addEventListener('click', (e) => {
  const t = e.target.closest('.tab');
  if (t) switchTab(t.dataset.tab);
});
sortSegEl.addEventListener('click', (e) => {
  const b = e.target.closest('.segbtn');
  if (b) setSort(b.dataset.sort);
});

/* -------------------------------- boot ----------------------------------- */

const hashMatch = /^#\/t\/(\d+)$/.exec(location.hash);
if (hashMatch) state.cursor = Number(hashMatch[1]);

paintSortControl();      // state.sort came from localStorage; the markup's default may be stale
renderFeed();
renderThread();
renderTitleBadge();
loadStatus();
loadFeed().then(() => { if (state.cursor != null && !state.detail) loadDetail(state.cursor); });

// 5s while the tab is visible; still every ~30s when it is not, so a background
// tab (or an embedded view that always reports itself hidden) never goes stale.
let tick = 0;
setInterval(() => { tick++; if (!document.hidden || tick % 6 === 0) { loadFeed(); loadStatus(); } }, POLL_MS);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { loadFeed(); loadStatus(); } });
// relative timestamps drift; repaint the feed once a minute even without new data
setInterval(() => { cardEls.forEach((c) => { c.dataset.sig = ''; }); renderFeed(); }, 60000);
</script>
