<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slack Copilot</title>
<style>
  /* ================= tokens (docs/ux.md §2) =================
     The palette follows the Mac's appearance setting. :root holds the dark
     scheme (unchanged); the prefers-color-scheme:light block below swaps in a
     light ramp — designed for white, not an inversion of the dark greys, which
     goes muddy and washes the urgency hues out. There is no toggle and no
     stored preference: "follow the system" is the whole feature, and macOS
     switches at sunset for a lot of people, so this flips live.
     Rules for adding colour below: never hardcode a hex or an rgba() in a rule,
     because it can only ever be right in one of the two schemes. Add a token. */
  :root{
    color-scheme:light dark;
    --bg:#0d1117; --surface:#151b23; --surface-2:#1d2530; --border:#2a313c;
    --text:#e6edf3; --text-2:#9aa4b2; --text-3:#646d79;
    --accent:#4c8dff; --ok:#3fb950; --warn:#e3b341;
    --p0:#f85149; --p1:#f0883e; --p2:#d29922; --p3:#8b949e;
    /* text that sits ON a saturated fill: P0 chip, primary button, send button */
    --on-fill:#0d1117; --on-fill-2:rgba(13,17,23,.7); --on-fill-line:rgba(13,17,23,.35);
    /* workspace identity — fixed per workspace, never derived from urgency */
    --ws-fg:#0d1117;
    --ws-0:#39c5cf; --ws-1:#bc8cff; --ws-2:#e3b341;
    --ws-3:#7ee787; --ws-4:#ffa198; --ws-5:#79c0ff;
    /* translucent washes (composited over --surface or --bg) + matching hairlines */
    --wash-p0:rgba(248,81,73,.06);      /* the P0 card tint, deliberately faint */
    --wash-p0-2:rgba(248,81,73,.10);    /* error strip, setup banner, chat error */
    --wash-warn:rgba(227,179,65,.10); --wash-accent:rgba(76,141,255,.12);
    --wash-ok:rgba(63,185,80,.05); --wash-pulse:rgba(76,141,255,.18);
    --line-p0:rgba(248,81,73,.45); --line-warn:rgba(227,179,65,.38);
    --line-accent:rgba(76,141,255,.42); --line-ok:rgba(63,185,80,.55);
    /* chrome */
    --done-fade:.45;
    --scroll:#252d38; --scroll-h:#313b48; --scrim:rgba(3,6,10,.72);
    --shadow-pane:-10px 0 30px rgba(0,0,0,.5);
    --shadow-menu:0 8px 24px rgba(0,0,0,.5);
    --shadow-modal:0 20px 60px rgba(0,0,0,.6);
    --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  /* Light. Cards are white and lift off a soft grey canvas, so --bg is now the
     *darker* of the two and text fields still read as recessed wells. The
     urgency hues keep their identity (red / orange / amber / grey) but are
     re-tuned: on white the dark-mode values vibrate (P0) or vanish (P2 amber,
     2.2:1 as text). Every pair here was measured — worst case is 4.56:1. */
  @media (prefers-color-scheme:light){
    :root{
      --bg:#eef1f6; --surface:#ffffff; --surface-2:#e3e8f0; --border:#ccd4de;
      --text:#11161d; --text-2:#48525e; --text-3:#58626e;
      --accent:#0a58c8; --ok:#14763a; --warn:#7d5c00;
      --p0:#bc1f28; --p1:#a94400; --p2:#7f5c00; --p3:#55606c;
      --on-fill:#ffffff; --on-fill-2:rgba(255,255,255,.85); --on-fill-line:rgba(255,255,255,.45);
      --ws-fg:#ffffff;
      --ws-0:#0f7285; --ws-1:#6b35c4; --ws-2:#8a6100;
      --ws-3:#1d7a41; --ws-4:#b03a37; --ws-5:#1c5fb0;
      /* washes are mixed from a brighter version of each hue: an alpha of the
         dark text colour turns every tinted band into khaki mud on white */
      --wash-p0:rgba(214,45,45,.07); --wash-p0-2:rgba(224,70,70,.12);
      --wash-warn:rgba(240,180,30,.20); --wash-accent:rgba(31,111,235,.11);
      --wash-ok:rgba(31,150,70,.11); --wash-pulse:rgba(31,111,235,.16);
      --line-p0:rgba(188,31,40,.40); --line-warn:rgba(160,115,0,.40);
      --line-accent:rgba(10,88,200,.35); --line-ok:rgba(20,118,58,.45);
      --done-fade:.55;
      --scroll:#c9d1dc; --scroll-h:#aeb9c8; --scrim:rgba(24,30,40,.42);
      --shadow-pane:-10px 0 30px rgba(15,23,42,.14);
      --shadow-menu:0 8px 24px rgba(15,23,42,.16);
      --shadow-modal:0 20px 60px rgba(15,23,42,.22);
    }
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--text);
    font:13px/1.45 var(--sans);
    min-width:860px; overflow-x:auto; overflow-y:hidden;
  }
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}
  .mono{font-family:var(--mono)}
  .app{display:flex;flex-direction:column;height:100vh}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:var(--scroll);border-radius:6px;border:2px solid var(--bg)}
  ::-webkit-scrollbar-thumb:hover{background:var(--scroll-h)}
  ::-webkit-scrollbar-track{background:transparent}

  /* ================= top bar ================= */
  .topbar{
    display:flex;align-items:center;gap:16px;padding:8px 14px;
    border-bottom:1px solid var(--border);background:var(--surface);flex:none;
  }
  .brand{font-weight:700;font-size:13px;flex:none;user-select:none}
  .brand .dot{color:var(--accent)}
  .tabs{display:flex;gap:2px}
  .tab{padding:4px 10px;border-radius:6px;color:var(--text-2);cursor:pointer;font-size:12.5px;
    background:none;border:none;font-family:inherit}
  .tab:hover{color:var(--text)}
  .tab.active{background:var(--surface-2);color:var(--text);font-weight:600}
  .tab .count{color:var(--accent);font-family:var(--mono);font-size:11px;margin-left:4px}
  .statuses{margin-left:auto;display:flex;align-items:center;gap:12px;font-size:11.5px;color:var(--text-2)}
  .st{display:flex;align-items:center;gap:5px;white-space:nowrap}
  .st i{width:7px;height:7px;border-radius:50%;display:inline-block;flex:none}
  .st i.ok{background:var(--ok)} .st i.warn{background:var(--warn)} .st i.err{background:var(--p0)}
  .queue{font-family:var(--mono);font-size:11px;color:var(--text-3);
    border:1px solid var(--border);border-radius:10px;padding:1px 8px;white-space:nowrap;cursor:help}
  .queue.busy{color:var(--accent);border-color:var(--line-accent)}
  .queue.errq{color:var(--p0);border-color:var(--line-p0)}
  .queue.warnq{color:var(--warn);border-color:var(--line-warn)}
  .helpbtn{font-family:var(--mono);font-size:11px;color:var(--text-3);background:none;
    border:1px solid var(--border);border-radius:4px;padding:1px 7px;cursor:pointer}
  .helpbtn:hover{color:var(--text)}

  /* ambient error strip — never modal (docs/ux.md §7) */
  .strip{
    flex:none;background:var(--wash-warn);border-bottom:1px solid var(--line-warn);
    color:var(--warn);font-size:12px;padding:4px 14px;display:none;
  }
  .strip.on{display:block}
  .strip.err{background:var(--wash-p0-2);border-bottom-color:var(--line-p0);color:var(--p0)}
  .strip.info{background:var(--wash-accent);border-bottom-color:var(--line-accent);color:var(--accent)}

  /* setup banner — persistent and prominent, but still not modal: the feed stays
     fully usable behind it. Only shown for a fault a human must fix by hand. */
  .setupbanner{
    flex:none;display:none;gap:11px;align-items:flex-start;
    background:linear-gradient(var(--wash-p0-2),var(--wash-p0-2)),var(--surface);
    border-bottom:1px solid var(--line-p0);padding:10px 14px;
  }
  .setupbanner.on{display:flex}
  .setupbanner .sbicon{flex:none;font-size:14px;line-height:1.4;color:var(--p0)}
  .setupbanner .sbmain{min-width:0;flex:1}
  .setupbanner .sbtitle{font-size:13px;font-weight:700;color:var(--text)}
  .setupbanner .sbsub{font-size:12px;color:var(--text-2);margin-top:3px;line-height:1.5}
  .cmdrow{display:flex;align-items:center;gap:8px;margin-top:7px;flex-wrap:wrap}
  .cmdrow .lead{font-size:12px;color:var(--text-2)}
  /* user-select:all = one click selects the whole command, ⌘C then works */
  .cmd{font-family:var(--mono);font-size:12px;color:var(--text);background:var(--bg);
    border:1px solid var(--border);border-radius:5px;padding:3px 9px;white-space:nowrap;
    user-select:all;-webkit-user-select:all;cursor:text}
  .copybtn{border:1px solid var(--border);background:var(--surface);color:var(--text-2);
    border-radius:5px;padding:3px 10px;font-size:11.5px;cursor:pointer;font-family:inherit;flex:none}
  .copybtn:hover{color:var(--text);border-color:var(--text-3)}
  .copybtn.done{color:var(--ok);border-color:var(--line-ok)}

  /* "Continue in Claude Code" — the card in the thread pane and the matching strip
     in the chat pane (public/chat.js reuses these classes). The fallback is built
     from the same .cmdrow / .cmd / .copybtn parts as the setup banner above: it is
     the same idea — "here is the command, copy it" — so it looks like the same
     thing rather than something bolted on. */
  .hocard{border:1px solid var(--border);border-radius:9px;background:var(--surface);
    padding:11px 13px;margin:0 0 12px}
  .hotitle{font-size:12.5px;font-weight:700;color:var(--text)}
  .hosub{font-size:12px;color:var(--text-2);margin-top:3px;line-height:1.5}
  .hoitem{margin-top:9px;padding-top:9px;border-top:1px solid var(--border)}
  .hoitem.first{border-top:0;padding-top:0}
  .holabel{font-size:12px;color:var(--text);font-weight:600;margin-bottom:4px}
  .hobtn{border:1px solid var(--border);background:var(--bg);color:var(--text);
    border-radius:6px;padding:4px 11px;font-size:12px;cursor:pointer;font-family:inherit}
  .hobtn:hover:not(:disabled){border-color:var(--text-3)}
  .hobtn:disabled{opacity:.6;cursor:default}
  .howarn{font-size:11.5px;color:var(--warn);margin-top:4px;line-height:1.5}
  .honote{font-size:11.5px;color:var(--text-2);margin-top:5px;line-height:1.5}
  .honote.bad{color:var(--p0)}
  .honote.good{color:var(--ok)}
  /* A resume command is ~85 characters, so unlike the setup banner's short `claude
     auth login` it has to wrap — otherwise it pushes a whole pane sideways. */
  .hocard .cmd{white-space:pre-wrap;word-break:break-all}
  .chat .hocard{margin:0;border:0;border-top:1px solid var(--border);border-radius:0;
    background:var(--surface);padding:9px 12px}
  .chat .hotoggle{display:flex;align-items:center;gap:6px;width:100%;background:none;
    border:0;padding:0;color:var(--text-2);font-family:inherit;font-size:11.5px;
    cursor:pointer;text-align:left}
  .chat .hotoggle:hover{color:var(--text)}

  /* ================= 3-pane layout ================= */
  .main{flex:1;display:grid;grid-template-columns:380px minmax(480px,1fr) 400px;min-height:0;position:relative}
  body.chat-closed .main{grid-template-columns:380px minmax(480px,1fr) 0}
  body.chat-closed .chat{display:none}
  .pane{min-height:0;min-width:0;display:flex;flex-direction:column}
  .feed{border-right:1px solid var(--border)}
  .chat{border-left:1px solid var(--border);background:var(--surface)}
  /* the one breakpoint: chat overlays the thread instead of squeezing it.
     Fires at 1260px = 380 feed + 480 thread min + 400 chat, i.e. the exact width
     below which the three-column grid would start clipping. */
  @media (max-width:1260px){
    .main{grid-template-columns:380px minmax(0,1fr) 0}
    .chat{position:absolute;top:0;right:0;bottom:0;width:400px;z-index:20;
      box-shadow:var(--shadow-pane)}
  }

  /* ================= feed ================= */
  /* sort control: worded segments, never icon-only — this row has to be readable
     by someone who has never seen the app before. */
  .feedhead{flex:none;display:flex;align-items:center;gap:8px;padding:6px 10px;
    border-bottom:1px solid var(--border);background:var(--bg)}
  .feedhead .sortlab{font-size:11px;color:var(--text-3);user-select:none;flex:none}
  .seg{display:flex;border:1px solid var(--border);border-radius:6px;overflow:hidden}
  .segbtn{padding:3px 9px;font-family:inherit;font-size:12px;line-height:1.5;color:var(--text-2);
    background:none;border:none;border-left:1px solid var(--border);cursor:pointer;white-space:nowrap}
  .segbtn:first-child{border-left:none}
  .segbtn:hover{color:var(--text);background:var(--surface)}
  .segbtn.active{background:var(--surface-2);color:var(--text);font-weight:600}
  .feedlist{flex:1;overflow-y:auto;padding:6px}
  .group-label{
    font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--text-3);
    text-transform:uppercase;padding:8px 8px 2px;display:flex;align-items:center;gap:6px;user-select:none;
  }
  .group-label .spin{color:var(--warn);animation:fade 1.6s ease-in-out infinite}
  @keyframes fade{50%{opacity:.25}}
  .card{
    position:relative;background:var(--surface);border:1px solid var(--border);
    border-radius:6px;padding:8px 10px 8px 14px;margin:4px 0;cursor:pointer;
  }
  .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
    border-radius:6px 0 0 6px;background:var(--edge,transparent)}
  .card:hover{background:var(--surface-2)}
  .card.sel{background:var(--surface-2);outline:1px solid var(--accent);outline-offset:-1px}
  .card.p0{--edge:var(--p0);background:linear-gradient(var(--wash-p0),var(--wash-p0)),var(--surface)}
  .card.p0:hover,.card.p0.sel{background:linear-gradient(var(--wash-p0),var(--wash-p0)),var(--surface-2)}
  .card.p1{--edge:var(--p1)} .card.p2{--edge:var(--p2)} .card.p3{--edge:var(--p3)}
  /* archived, so deliberately faint (docs/ux.md §3) — but fading toward white
     costs more contrast than fading toward black, so light needs a higher
     value to land at the same read-as-done-not-gone level (2.5:1 vs 2.4:1). */
  .card.done{opacity:var(--done-fade)}
  .card.pulse{animation:pulse .3s ease-out}
  @keyframes pulse{from{background:var(--wash-pulse)}}

  .crow1{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text-3);margin-bottom:3px}
  .chip{font-family:var(--mono);font-size:10px;font-weight:700;border-radius:4px;
    padding:0 5px;line-height:16px;flex:none;border:1px solid transparent}
  .chip.c0{background:var(--p0);color:var(--on-fill)}
  .chip.c1{border-color:var(--p1);color:var(--p1)}
  .chip.c2{border-color:var(--p2);color:var(--p2)}
  .chip.c3{border-color:var(--p3);color:var(--p3)}
  .chip.pending{border:1px dashed var(--text-3);color:var(--text-3)}
  .stale-mark{color:var(--warn);font-size:12px;flex:none;cursor:help}
  .ws{font-family:var(--mono);font-size:9px;font-weight:700;color:var(--ws-fg);border-radius:3px;
    width:14px;height:14px;display:inline-flex;align-items:center;justify-content:center;flex:none}
  .chan{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-2);max-width:19ch;flex:none}
  .kind{color:var(--text-3);flex:none}
  .ctime{margin-left:auto;font-family:var(--mono);font-size:10.5px;flex:none;white-space:nowrap}
  .hoverbtns{display:none;gap:2px;margin-left:6px;flex:none}
  .card:hover .hoverbtns,.card.sel .hoverbtns{display:inline-flex}
  .hbtn{border:1px solid var(--border);background:var(--surface);color:var(--text-2);
    border-radius:4px;font-size:10px;line-height:15px;padding:0 5px;cursor:pointer;font-family:inherit}
  .hbtn:hover{color:var(--text);border-color:var(--text-3)}

  .crow2{display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden}
  .udot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex:none}
  .card.seen .udot,.card.done .udot{display:none}
  .ddone{display:none;color:var(--ok);font-size:11px;flex:none}
  .card.done .ddone{display:inline}
  .sender{font-weight:600;flex:none;max-width:16ch;overflow:hidden;text-overflow:ellipsis}
  .snippet{color:var(--text);overflow:hidden;text-overflow:ellipsis}
  .card.seen .sender,.card.seen .snippet,.card.done .sender,.card.done .snippet{color:var(--text-2);font-weight:400}
  .card.seen .sender,.card.done .sender{font-weight:500}

  .crow3{display:flex;gap:6px;align-items:center;white-space:nowrap;overflow:hidden;margin-top:2px}
  .spark{color:var(--accent);font-size:10px;flex:none}
  .why{color:var(--text-2);overflow:hidden;text-overflow:ellipsis;font-size:12px}
  .card.stale .why{opacity:.6}
  /* honest replacement for the shimmer when nothing is actually running */
  .why.waiting{color:var(--text-3);font-style:italic}
  .why.shimmer{font-style:italic;
    background:linear-gradient(90deg,var(--text-3) 40%,var(--text-2) 50%,var(--text-3) 60%);
    background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
    animation:sh 1.6s linear infinite}
  @keyframes sh{to{background-position:-200% 0}}

  .feedfoot{flex:none;border-top:1px solid var(--border);padding:5px 12px;
    font-family:var(--mono);font-size:10px;color:var(--text-3);white-space:nowrap;overflow:hidden}
  .feedfoot b{color:var(--text-2);font-weight:600}

  /* skeletons + empty */
  .skel{background:var(--surface);border:1px solid var(--border);border-radius:6px;
    padding:10px 10px 10px 14px;margin:4px 0}
  .skel div{height:8px;border-radius:3px;background:var(--surface-2);margin:6px 0;
    animation:sk 1.4s ease-in-out infinite}
  @keyframes sk{50%{opacity:.45}}
  .placeholder{padding:48px 24px;text-align:center;color:var(--text-3);font-size:12.5px;line-height:1.7}
  .placeholder b{display:block;color:var(--text-2);font-size:13px;font-weight:600;margin-bottom:6px}
  .placeholder .kbd{font-family:var(--mono);color:var(--text-2)}

  /* ================= thread ================= */
  .thread{overflow:hidden}
  .thead{flex:none;display:flex;align-items:center;gap:8px;padding:10px 16px;
    border-bottom:1px solid var(--border);background:var(--bg)}
  .thead .title{font-weight:700;font-size:14px;white-space:nowrap;flex:none;max-width:28ch;
    overflow:hidden;text-overflow:ellipsis}
  .thead .sub{color:var(--text-3);font-size:11.5px;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;min-width:0;flex:1}
  .tactions{margin-left:auto;display:flex;gap:6px;flex:none;position:relative}
  .btn{border:1px solid var(--border);background:var(--surface);color:var(--text);
    border-radius:6px;padding:4px 10px;font-size:12px;cursor:pointer;font-family:inherit;white-space:nowrap}
  .btn:hover{background:var(--surface-2)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-fill);font-weight:600}
  .btn.primary:hover{filter:brightness(1.1);background:var(--accent)}
  .key{font-family:var(--mono);font-size:9.5px;border:1px solid var(--border);
    border-bottom-width:2px;border-radius:3px;padding:0 4px;color:var(--text-3);margin-left:5px}
  .btn.primary .key{border-color:var(--on-fill-line);color:var(--on-fill-2)}
  .menu{position:absolute;right:0;top:32px;background:var(--surface);border:1px solid var(--border);
    border-radius:6px;padding:4px;z-index:30;min-width:180px;box-shadow:var(--shadow-menu)}
  .menu button{display:block;width:100%;text-align:left;background:none;border:none;color:var(--text);
    font:12px var(--sans);padding:5px 8px;border-radius:4px;cursor:pointer}
  .menu button:hover:not(:disabled){background:var(--surface-2)}
  .menu button:disabled{color:var(--text-3);cursor:default}

  .tscroll{flex:1;overflow-y:auto;outline:none}
  .tscroll:focus-visible{box-shadow:inset 0 0 0 1px var(--accent)}
  .tbody{padding:14px 16px 28px;max-width:900px}

  /* analysis card */
  .analysis{border:1px solid var(--border);border-radius:8px;background:var(--surface);margin-bottom:16px}
  .stalebanner{display:flex;align-items:center;gap:8px;padding:6px 12px;font-size:12px;color:var(--warn);
    background:var(--wash-warn);border-bottom:1px solid var(--line-warn);border-radius:8px 8px 0 0}
  .abody{padding:12px 14px}
  .awhy{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;margin-bottom:8px}
  .awhy .chev{margin-left:auto;color:var(--text-3);cursor:pointer;background:none;border:none;
    font-size:11px;font-family:var(--mono);padding:0 4px}
  .awhy .chev:hover{color:var(--text)}
  .awhy .whytext{overflow:hidden;text-overflow:ellipsis}
  .analysis.collapsed .abody>*:not(.awhy){display:none}
  .analysis.collapsed .ameta{display:none}
  .asec{margin:8px 0;font-size:12.5px;color:var(--text-2)}
  .asec b{color:var(--text);font-weight:600}
  .action-row{display:flex;align-items:flex-start;gap:10px}
  .action-row .draftbtn{flex:none;border:1px solid var(--accent);color:var(--accent);background:none;
    border-radius:6px;padding:2px 8px;font-size:11.5px;cursor:pointer;font-family:inherit;white-space:nowrap}
  .action-row .draftbtn:hover{background:var(--wash-accent)}
  .ctx{list-style:none;margin-top:4px}

<script>
'use strict';
/* =========================================================================
   Slack Copilot UI — vanilla, single file, no external assets.
   Spec: docs/ux.md · reference render: docs/ux-mock.html

   SECURITY (do not regress):
   1. COPILOT_TOKEN below holds the placeholder literal that src/server.ts swaps
      for the per-run token when it serves '/' or '/index.html'. Keep exactly one
      occurrence of it in this file (server-side replace is global, so a second
      copy — even in a comment — would leak the token into the served page).
      Every /api/* request goes through apiFetch() so it carries the token; there
      is no unwrapped call to the API anywhere in this file.
   2. Every Slack-controlled string (message text, author/channel/team names,
      and Claude's why/summary/action/context) is attacker-influenced. It only
      ever reaches the DOM through textContent / createElement, or through the
      html`` tagged template which escapes interpolations with esc(). The
      mrkdwn renderer builds real DOM nodes — message text never touches
      innerHTML at all, so `<img src=x onerror=...>` renders as inert text.
   3. Only /^https?:\/\//i URLs become links (httpUrlOrNull), always with
      rel="noopener noreferrer".
   ========================================================================= */

const COPILOT_TOKEN = '__COPILOT_TOKEN__';

/** fetch() for /api/*, with the per-run token attached. */
function apiFetch(url, options) {
  const opts = options ? Object.assign({}, options) : {};
  opts.headers = Object.assign({}, opts.headers, { 'x-copilot-token': COPILOT_TOKEN });
  return fetch(url, opts);
}

// The token is minted per server run, so a dev-server restart invalidates the copy baked
// into this page. Reload once (rate-limited, so a genuinely broken token can't loop).
function handleAuthFailure() {
  const last = Number(sessionStorage.getItem('copilot-auth-reload') || 0);
  if (Date.now() - last < 15000) return;
  sessionStorage.setItem('copilot-auth-reload', String(Date.now()));
  location.reload();
}

/** HTML-escape. Required for ANY string-built markup; see html`` below. */
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

/** Tagged template that escapes every interpolation. The only sanctioned way to
 *  build a markup string here; static literals are trusted, values never are. */
function html(strings) {
  let out = strings[0];
  for (let i = 1; i < arguments.length; i++) out += esc(arguments[i]) + strings[i];
  return out;
}

// Permalinks come from Slack (untrusted). Escaping blocks attribute breakout but not a
// javascript:/data: URI, which would run on this origin when clicked — so only http(s)
// URLs are ever turned into a link.
function httpUrlOrNull(u) {
  const s = String(u ?? '');
  return /^https?:\/\//i.test(s) ? s : null;
}

/** JSON GET/POST through apiFetch, with the shared 401 recovery. */
async function api(path, options) {
  const res = await apiFetch(path, options);
  if (res.status === 401) { handleAuthFailure(); throw new Error('unauthorized'); }
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}

/* ============================ tiny DOM helpers ============================ */

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = String(text);
  return n;
}
function link(url, label) {
  const safe = httpUrlOrNull(url);
  if (!safe) return el('span', null, label);
  const a = document.createElement('a');
  a.href = safe;
  a.target = '_blank';
  a.rel = 'noopener noreferrer';
  a.textContent = label;
  return a;
}

/* ============================== time helpers ============================== */

function tsMs(slackTs) {
  const ms = parseFloat(slackTs) * 1000;
  return isFinite(ms) ? ms : NaN;
}
/** now · 5m · 2h · Mon · Jul 28 */
function relTime(slackTs) {
  const ms = tsMs(slackTs);
  if (!isFinite(ms)) return '';
  const s = Math.max(0, Math.round((Date.now() - ms) / 1000));
  if (s < 45) return 'now';
  const m = Math.round(s / 60);
  if (m < 60) return m + 'm';
  const h = Math.round(m / 60);
  if (h < 24) return h + 'h';
  const d = Math.floor((startOfDay(Date.now()) - startOfDay(ms)) / 86400000);
  if (d < 7) return new Date(ms).toLocaleDateString(undefined, { weekday: 'short' });
  return new Date(ms).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
}
function startOfDay(ms) { const d = new Date(ms); d.setHours(0, 0, 0, 0); return d.getTime(); }
function clockTime(slackTs) {
  const ms = tsMs(slackTs);
  if (!isFinite(ms)) return '';
  return new Date(ms).toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
}
function dayLabel(slackTs) {
  const ms = tsMs(slackTs);
  if (!isFinite(ms)) return '';
  const diff = Math.round((startOfDay(Date.now()) - startOfDay(ms)) / 86400000);
  if (diff === 0) return 'Today';
  if (diff === 1) return 'Yesterday';
  if (diff < 7) return new Date(ms).toLocaleDateString(undefined, { weekday: 'long' });
  return new Date(ms).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
}
/** ISO-ish analyzed_at → "6m ago" */
function agoFromIso(iso) {
  const ms = Date.parse(String(iso ?? ''));
  if (!isFinite(ms)) return null;
  const s = Math.max(0, Math.round((Date.now() - ms) / 1000));
  if (s < 45) return 'just now';
  const m = Math.round(s / 60);
  if (m < 60) return m + 'm ago';
  const h = Math.round(m / 60);
  if (h < 24) return h + 'h ago';
  return Math.round(h / 24) + 'd ago';
}

/* ============================ Slack mrkdwn =============================== */
/* Slack sends message text with &, < and > entity-encoded, and wraps its own
   tokens in angle brackets (<@U1>, <#C1|name>, <https://x|label>). We build DOM
   nodes directly: nothing here ever produces an HTML string. */

const EMOJI = {
  smile:'😄', smiley:'😃', grin:'😁', joy:'😂', sweat_smile:'😅', laughing:'😆',
  wink:'😉', blush:'😊', thinking_face:'🤔', neutral_face:'😐', confused:'😕',
  cry:'😢', sob:'😭', scream:'😱', angry:'😠', rage:'😡', sleeping:'😴',
  sunglasses:'😎', nerd_face:'🤓', heart:'❤️', broken_heart:'💔', fire:'🔥',
  tada:'🎉', sparkles:'✨', rocket:'🚀', star:'⭐', star2:'🌟', zap:'⚡',
  boom:'💥', bulb:'💡', warning:'⚠️', bangbang:'‼️', question:'❓',
  white_check_mark:'✅', heavy_check_mark:'✔️', x:'❌', no_entry:'⛔',
  eyes:'👀', wave:'👋', pray:'🙏', clap:'👏', muscle:'💪', ok_hand:'👌',
  thumbsup:'👍', '+1':'👍', thumbsdown:'👎', '-1':'👎', point_right:'👉',
  raised_hands:'🙌', handshake:'🤝', bow:'🙇', facepalm:'🤦', shrug:'🤷',
  coffee:'☕', beer:'🍺', pizza:'🍕', cake:'🍰', taco:'🌮',
  calendar:'📅', date:'📆', clock1:'🕐', hourglass:'⏳', alarm_clock:'⏰',
  memo:'📝', pencil:'✏️', book:'📖', chart_with_upwards_trend:'📈',
  bug:'🐛', wrench:'🔧', hammer:'🔨', gear:'⚙️', lock:'🔒', key:'🔑',
  mag:'🔍', link:'🔗', email:'📧', bell:'🔔', mega:'📣', pushpin:'📌',
  green_circle:'🟢', red_circle:'🔴', large_blue_circle:'🔵', 'sos':'🆘',
  ship:'🚢', tada2:'🎊', 'raised_hand':'✋', 'point_up':'☝️', 'no_bell':'🔕',
  100:'💯', ok:'🆗', new:'🆕', up:'🆙', top:'🔝', recycle:'♻️'
};

function decodeEntities(s) {
  return String(s).replace(/&(amp|lt|gt|quot|#0?39|apos);/g, (m, e) => (
    e === 'amp' ? '&' : e === 'lt' ? '<' : e === 'gt' ? '>' : e === 'quot' ? '"' : "'"
  ));
}

function shortUrl(u) {
  try {
    const p = new URL(u);
    const seg = p.pathname.split('/').filter(Boolean)[0];
    return p.host + (seg ? '/' + seg + (p.pathname.split('/').filter(Boolean).length > 1 ? '/…' : '') : '');
  } catch (_) { return u; }
}

const INLINE_SRC = "`([^`\\n]+)`|<([^<>\\n]*)>|:([a-z0-9_+\\-']+):|\\*([^*\\n]+)\\*|_([^_\\n]+)_|~([^~\\n]+)~";

/** Resolve <...> Slack angle tokens to a DOM node. `names` maps user id → display name. */
function angleToken(inner, names) {
  const head = inner.charAt(0);
  const bar = inner.indexOf('|');
  const body = bar >= 0 ? inner.slice(0, bar) : inner;
  const label = bar >= 0 ? inner.slice(bar + 1) : '';
  if (head === '@') {
    const id = body.slice(1);
    return el('span', 'mention', '@' + (label || (names && names[id]) || id));
  }
  if (head === '#') {
    const id = body.slice(1);
    return el('span', 'mention', '#' + (label || id));
  }
  if (head === '!') {
    const word = body.slice(1);
    if (word === 'here' || word === 'channel' || word === 'everyone') {
      return el('span', 'mention', '@' + word);
    }
    return el('span', null, label || '<' + inner + '>');
  }
  if (/^mailto:/i.test(body)) return el('span', null, label || body.replace(/^mailto:/i, ''));
  const safe = httpUrlOrNull(body);
  if (safe) return link(safe, label || shortUrl(safe));
  return el('span', null, decodeEntities('<' + inner + '>'));
}

function appendInline(parent, text, names, depth) {
  const src = String(text ?? '');
  // fresh regex per call: appendInline recurses (bold containing code, …) and a
  // shared /g/ regex would have its lastIndex clobbered by the inner pass.
  const re = new RegExp(INLINE_SRC, 'gi');
  let last = 0, m;
  while ((m = re.exec(src)) !== null) {
    // `_italic_` only counts on word boundaries (protects snake_case identifiers).
    // On rejection, rewind to just past the opening `_`: the rejected span may
    // have swallowed real markup (e.g. "api_key and *rotate* it_now"), which a
    // plain `continue` would silently drop back to literal text.
    if (m[5] !== undefined) {
      const before = src.charAt(m.index - 1), after = src.charAt(m.index + m[0].length);
      if (/\w/.test(before) || /\w/.test(after)) { re.lastIndex = m.index + 1; continue; }
    }
    if (m.index > last) parent.appendChild(document.createTextNode(decodeEntities(src.slice(last, m.index))));
    last = m.index + m[0].length;

    if (m[1] !== undefined) {
      parent.appendChild(el('span', 'code', decodeEntities(m[1])));
    } else if (m[2] !== undefined) {
      parent.appendChild(angleToken(m[2], names));
    } else if (m[3] !== undefined) {
      const code = m[3].toLowerCase();
      if (EMOJI[code]) parent.appendChild(document.createTextNode(EMOJI[code]));
      else parent.appendChild(el('span', 'emoji-miss', ':' + m[3] + ':'));
    } else {
      const tag = m[4] !== undefined ? 'strong' : m[5] !== undefined ? 'em' : 's';
      const inner = m[4] !== undefined ? m[4] : m[5] !== undefined ? m[5] : m[6];
      const node = el(tag);
      if (depth < 4) appendInline(node, inner, names, depth + 1);
      else node.textContent = decodeEntities(inner);
      parent.appendChild(node);
    }
  }
  if (last < src.length) parent.appendChild(document.createTextNode(decodeEntities(src.slice(last))));
}

function appendLines(parent, chunk, names) {
  const lines = String(chunk).split('\n');
  let quote = null;
  for (let i = 0; i < lines.length; i++) {
    const raw = lines[i];
    if (i === lines.length - 1 && raw === '' && lines.length > 1) continue; // trailing newline
    const isQuote = /^&gt;\s?|^>\s?/.test(raw);
    const body = isQuote ? raw.replace(/^(&gt;|>)\s?/, '') : raw;
    const line = el('div', 'mline');
    appendInline(line, body, names, 0);
    if (isQuote) {
      if (!quote) { quote = el('div', 'quote'); parent.appendChild(quote); }
      quote.appendChild(line);
    } else {
      quote = null;
      parent.appendChild(line);
    }
  }
}

/** Slack mrkdwn → DocumentFragment. No innerHTML anywhere on this path. */
function renderMrkdwn(text, names) {
  const frag = document.createDocumentFragment();
  const src = String(text ?? '');
  if (!src.trim()) {
    frag.appendChild(el('span', 'empty-msg', '(no text — file, attachment, or rich block)'));
    return frag;
  }
  const parts = src.split('```');
  for (let i = 0; i < parts.length; i++) {
    if (i % 2 === 1) {
      frag.appendChild(el('pre', 'codeblock', decodeEntities(parts[i].replace(/^\n/, '').replace(/\n$/, ''))));
    } else {
      // a chunk that follows a fence starts with the newline that closed it
      const chunk = i > 0 ? parts[i].replace(/^\n/, '') : parts[i];
      if (chunk !== '') appendLines(frag, chunk, names);
    }
  }
  return frag;
}

/** Slack mrkdwn → single-line plain text (feed snippets). Returned as a string,
 *  always assigned with textContent. */
function plainText(text, names) {
  let s = String(text ?? '');
  s = s.replace(/```/g, ' ');
  s = s.replace(/<([^<>\n]*)>/g, (m, inner) => {
    const head = inner.charAt(0);
    const bar = inner.indexOf('|');
    const body = bar >= 0 ? inner.slice(0, bar) : inner;
    const label = bar >= 0 ? inner.slice(bar + 1) : '';
    if (head === '@') return '@' + (label || (names && names[body.slice(1)]) || body.slice(1));
    if (head === '#') return '#' + (label || body.slice(1));
    if (head === '!') return '@' + body.slice(1);
    return label || body.replace(/^mailto:/i, '');
  });
  s = s.replace(/:([a-z0-9_+\-']+):/gi, (m, c) => EMOJI[c.toLowerCase()] || m);
  // drop `_` only when it delimits italics, so snake_case survives the snippet
  s = s.replace(/(^|[^\w])_([^_\n]+)_(?=[^\w]|$)/g, '$1$2');
  s = s.replace(/[*~`]/g, '');
  s = decodeEntities(s);
  return s.replace(/\s+/g, ' ').trim();
}

/* ================================= state ================================= */

const POLL_MS = 5000;
const MAX_HYDRATE = 10;
const RANK = { P0: 0, P1: 1, P2: 2, P3: 3 };

/* --------------------------- feed sort preference -------------------------- */
/* Purely a display choice: sorting happens here, over the rows /api/feed already
   returned. The API and the server-side ordering are untouched. */
const SORT_KEY = 'copilot-feed-sort';
const SORT_MODES = ['priority', 'newest', 'oldest'];

/** Remembered across reloads and app restarts. Storage can throw (private mode,
 *  storage disabled), and a bad/absent value must never break the feed — both
 *  fall back to the default order. */
function loadSortMode() {
  try {
    const v = localStorage.getItem(SORT_KEY);
    return SORT_MODES.indexOf(v) >= 0 ? v : 'priority';
  } catch (_) { return 'priority'; }
}

const state = {
  items: [],
  loaded: false,
  feedError: null,
  lastOk: null,
  tab: 'inbox',
  sort: loadSortMode(),    // priority | newest | oldest  (display order only)
  cursor: null,
  focusPane: 'feed',       // feed | thread | chat
  chatOpen: false,
  detail: null,
  detailLoading: false,
  detailError: null,
  cache: new Map(),        // thread id -> { key, detail }
  overrides: new Map(),    // thread id -> { status, at }  (optimistic)
  knownIds: new Set(),
  chatSeed: '',
  chatNote: '',
  status: null,            // last /api/status payload (analyzer + server + workspaces)
  statusError: null,
  reanalyze: new Map(),    // thread id -> 'busy' | 'queued' (transient UI state)
  handoff: new Map(),      // thread id -> "Continue in Claude Code" state (see loadHandoff)
};

const feedListEl = document.getElementById('feedlist');
const threadEl = document.getElementById('thread');
const chatEl = document.getElementById('chat');
const stripEl = document.getElementById('strip');
const bannerEl = document.getElementById('setupbanner');
const statusesEl = document.getElementById('statuses');
const overlayEl = document.getElementById('overlay');
const sortSegEl = document.getElementById('sortseg');
const cardEls = new Map();

/* ------------------------- analyzer health helpers ------------------------ */
/* Everything the page says about "is this thing working?" comes from
   /api/status. When it has not loaded (or the route is missing on an older
   server) these all return null/false and the UI keeps its previous behaviour. */

function analyzerInfo() {
  const a = state.status && state.status.analyzer;
  return a && typeof a === 'object' ? a : null;
}
function analyzerErr() {
  const a = analyzerInfo();
  return a && a.lastError && typeof a.lastError === 'object' ? a.lastError : null;
}
/** True when no thread is going to get prioritized until something changes. */
function analyzerStalled() {
  const a = analyzerInfo();
  return !!a && (a.state === 'error' || a.state === 'disabled');
}
/** One plain sentence for whatever is wrong, or null when all is well. */
function analyzerTrouble() {
  const a = analyzerInfo();
  if (!a) return null;
  const e = analyzerErr();
  if (e) return { kind: e.kind, message: String(e.message || ''), hint: String(e.hint || '') };
  if (a.state === 'disabled') {
    return {
      kind: 'off',
      message: 'Prioritizing is switched off',
      hint: 'Messages still arrive and are kept; they just do not get an urgency rating.',
    };
  }
  return null;
}
/** Signature so sig-gated renders repaint when the health picture changes. */
function analyzerSig() {
  const a = analyzerInfo();
  const e = analyzerErr();
  return a ? [a.state, a.queued, a.currentThreadId, e ? e.kind + '|' + e.at : null].join('~') : 'none';
}

function urgencyOf(it) { return it && RANK[it.urgency] !== undefined ? it.urgency : null; }
function itemById(id) { return state.items.find((i) => i.id === id) || null; }
function analysisMetaFor(id) {
  const c = state.cache.get(id);
  return c && c.detail ? c.detail.analysis : null;
}
/** Replies landed after the analyzer's coverage point. */
function isStale(it) {
  const a = analysisMetaFor(it.id);
  if (!a || !a.covered_through_ts || !urgencyOf(it) || !it.last_activity) return false;
  return parseFloat(it.last_activity) > parseFloat(a.covered_through_ts) + 0.0001;
}
function staleCount(it) {
  const c = state.cache.get(it.id);
  const a = analysisMetaFor(it.id);
  if (!c || !c.detail || !a || !a.covered_through_ts) return 0;
  return c.detail.messages.filter((m) => parseFloat(m.ts) > parseFloat(a.covered_through_ts) + 0.0001).length;
}

/** The feed's display order. Tab filtering always happens first, so every sort
 *  mode composes with Inbox / Done / All.
 *
 *  priority (default, docs/ux.md §3) — not-yet-rated threads pinned on top as
 *    their own group, then P0→P1→P2→P3 with newest first inside each band.
 *  newest / oldest — pure `last_activity` order. Urgency stops being a sort key
 *    here, so the groups are suppressed: a chronological list chopped into
 *    urgency bands would describe an order the list does not have, and pinning
 *    the unrated group on top would break the chronology outright. One flat
 *    list; the chip and the coloured edge stay on every card.
 *
 *  `grouped` tells renderFeed which of the two shapes it got. */
function visibleItems() {
  const list = state.items.filter((i) =>
    state.tab === 'inbox' ? i.status !== 'done' : state.tab === 'done' ? i.status === 'done' : true);
  const act = (i) => parseFloat(i.last_activity || 0) || 0;
  const byAct = (a, b) => act(b) - act(a);

  if (state.sort === 'newest' || state.sort === 'oldest') {
    const flat = list.sort(state.sort === 'newest' ? byAct : (a, b) => act(a) - act(b));
    return { pending: [], ranked: flat, flat: flat, grouped: false };
  }

  const pending = list.filter((i) => !urgencyOf(i) && i.status !== 'done').sort(byAct);
  const ranked = list.filter((i) => !(!urgencyOf(i) && i.status !== 'done')).sort((a, b) => {
    const ra = RANK[a.urgency] !== undefined ? RANK[a.urgency] : 4;
    const rb = RANK[b.urgency] !== undefined ? RANK[b.urgency] : 4;
    return ra !== rb ? ra - rb : byAct(a, b);
  });
  return { pending, ranked, flat: pending.concat(ranked), grouped: true };
}

/** Header above the ranked list. In the chronological modes it also names the
 *  order, so the list explains itself without a look back up at the control. */
function feedGroupLabel() {
  const tab = state.tab === 'done' ? 'Done' : state.tab === 'all' ? 'All threads' : 'Inbox';
  if (state.sort === 'newest') return tab + ' · newest first';
  if (state.sort === 'oldest') return tab + ' · oldest first';
  return tab;
}

function paintSortControl() {
  if (!sortSegEl) return;
  sortSegEl.querySelectorAll('.segbtn').forEach((b) => {
    const on = b.dataset.sort === state.sort;
    b.classList.toggle('active', on);
    b.setAttribute('aria-pressed', on ? 'true' : 'false');
  });
}

/** Change the display order. The cursor is keyed by thread id (never by index),
 *  so the same conversation stays selected across the re-sort and is scrolled
 *  back into view — re-sorting must never hand the cursor to whatever floated
 *  to the top. */
function setSort(mode) {
  if (SORT_MODES.indexOf(mode) < 0 || state.sort === mode) return;
  state.sort = mode;
  try { localStorage.setItem(SORT_KEY, mode); } catch (_) { /* preference just won't stick */ }
  paintSortControl();
  renderFeed();
  ensureCursor();        // no-op unless the cursored thread is gone (same filter, so it isn't)
  scrollCursorIntoView();
  hydrate();             // the bounded stale-marker window now covers a different set of rows
}

function cycleSort() {
  setSort(SORT_MODES[(SORT_MODES.indexOf(state.sort) + 1) % SORT_MODES.length]);
}

/* =============================== data flow =============================== */

/** Selection, hydration and boot can all want the same thread at once; share one
 *  request instead of firing three identical ones. */
const inflight = new Map();
function fetchThread(id) {
  const running = inflight.get(id);
  if (running) return running;
  const p = api('/api/thread/' + id);
  inflight.set(id, p);
  p.then(() => inflight.delete(id), () => inflight.delete(id));
  return p;
}

function applyOverrides() {
  const now = Date.now();
  state.overrides.forEach((ov, id) => {
    const it = itemById(id);
    if (!it) { state.overrides.delete(id); return; }
    if (it.status === ov.status || now - ov.at > 8000) { state.overrides.delete(id); return; }
    it.status = ov.status;
  });
}

async function loadFeed() {
  try {
    const items = await api('/api/feed');
    state.items = Array.isArray(items) ? items : [];
    state.loaded = true;
    state.feedError = null;
    state.lastOk = Date.now();
    applyOverrides();
    ensureCursor();
    renderAll();
    hydrate();
  } catch (err) {
    state.feedError = err && err.message ? err.message : 'unknown error';
    renderStrip();
    renderStatuses();
  }
}

/** Health of the background worker, polled alongside the feed. A failure here is
 *  never fatal to the page — the feed stays fully usable. */
async function loadStatus() {
  try {
    const s = await api('/api/status');
    state.status = s && typeof s === 'object' ? s : null;
    state.statusError = null;
  } catch (err) {
    // Leave the last known status on screen rather than flickering to "fine".
    state.statusError = err && err.message ? err.message : 'unknown error';
  }
  renderBanner();
  renderStrip();
  renderStatuses();
  renderFeed();
  renderThread();
}

/** Ask the server to re-check one thread now (clears its retry backoff). */
async function reanalyze(id) {
  if (state.reanalyze.get(id) === 'busy') return;
  state.reanalyze.set(id, 'busy');
  flashStrip('Asking Claude to look at this message again…', 'info');
  renderThread();
  try {
    await api('/api/thread/' + id + '/reanalyze', { method: 'POST' });
    state.reanalyze.set(id, 'queued');
    renderThread();
    loadStatus();
    setTimeout(() => { state.reanalyze.delete(id); renderThread(); }, 2500);
  } catch (err) {
    state.reanalyze.delete(id);
    renderThread();
    const code = err && err.message ? err.message : '';
    flashStrip(code === 'HTTP 503'
      ? 'Prioritizing is switched off, so this message cannot be re-checked right now.'
      : code === 'HTTP 404'
        ? 'This message is no longer in the list, so it cannot be re-checked.'
        : 'Could not ask Claude to re-check this message. Try again in a moment.');
  }
}

/** Re-analyze control shared by the analysis card and the ⋯ menu. */
function reanalyzeLabel(id, idle) {
  const st = state.reanalyze.get(id);
  return st === 'busy' ? 'Asking Claude…' : st === 'queued' ? 'Queued ✓' : idle;
}

/** The feed endpoint has no covered_through_ts / analyzed_at, so per-thread
 *  detail is pulled lazily (cached by id+last_activity) to power the stale
 *  marker and make thread opens instant. Bounded to the top MAX_HYDRATE rows. */
let hydrating = false;
async function hydrate() {
  if (hydrating) return;
  const { flat } = visibleItems();
  const todo = flat.slice(0, MAX_HYDRATE).filter((it) => {
    const c = state.cache.get(it.id);
    return !c || c.key !== it.id + ':' + it.last_activity;
  });
  if (!todo.length) return;
  hydrating = true;
  try {
    for (const it of todo) {
      try {
        const d = await fetchThread(it.id);
        state.cache.set(it.id, { key: it.id + ':' + it.last_activity, detail: d });
        if (state.cursor === it.id) { state.detail = d; renderThread(); }
      } catch (_) { /* transient; next poll retries */ }
    }
  } finally {
    hydrating = false;
    renderFeed();
  }
}

function ensureCursor() {
  const { flat } = visibleItems();
  if (!flat.length) { if (state.cursor !== null) { state.cursor = null; state.detail = null; renderThread(); } return; }
  if (state.cursor === null || !flat.some((i) => i.id === state.cursor)) {
    setCursor(flat[0].id, { markSeen: false, silent: true });
  }
}

function setCursor(id, opts) {
  const o = opts || {};
  const changed = state.cursor !== id;
  state.cursor = id;
  history.replaceState(null, '', id ? '#/t/' + id : '#');
  if (changed) {
    state.detailError = null;
    loadDetail(id);
  }
  if (o.markSeen) {
    const it = itemById(id);
    if (it && it.status === 'new') setStatus(id, 'seen');
  }
  if (!o.silent) { renderFeed(); renderChat(); }
  if (changed) scrollCursorIntoView();
}

async function loadDetail(id) {
  // Which Claude sessions this thread can hand over to. Cheap, independent of the
  // transcript, and never allowed to fail the thread load.
  if (!handoffState(id).loaded) void loadHandoff(id);
  const it = itemById(id);
  const key = id + ':' + (it ? it.last_activity : '');
  const c = state.cache.get(id);
  if (c && c.key === key) {
    state.detail = c.detail; state.detailLoading = false; renderThread(); return;
  }
  state.detail = c ? c.detail : null;
  state.detailLoading = true;
  renderThread();
  try {
    const d = await fetchThread(id);
    if (state.cursor !== id) return;
    state.cache.set(id, { key, detail: d });
    state.detail = d;
    state.detailError = null;
  } catch (err) {
    if (state.cursor !== id) return;
    state.detailError = err && err.message ? err.message : 'failed';
  }
  state.detailLoading = false;
  renderThread();
  renderFeed();
}

/* ---------------------- continue in Claude Code -------------------------- */
/* Two Claude sessions exist per thread and they behave differently, so they are
   offered as two differently-labelled things. The server hands us the exact
   command for each; we either ask it to open a terminal (Mac app) or show the
   command with a Copy button (browser, or a launch that did not work out). */

function handoffState(id) {
  let h = state.handoff.get(id);
  if (!h) {
    h = {
      loaded: false, loading: false,
      canLaunch: false, chat: null, analysis: null,
      busy: null,        // 'chat' | 'analysis' while a launch is in flight
      shown: {},         // target -> true once its command row is revealed
      note: null,        // { text, tone } under the buttons
    };
    state.handoff.set(id, h);
  }
  return h;
}

/** Compact signature so renderThread only rebuilds the card when it really changed. */
function handoffSig(id) {
  const h = state.handoff.get(id);
  if (!h) return null;
  return [h.loaded, h.canLaunch, h.chat && h.chat.sessionId, h.analysis && h.analysis.sessionId,
    h.busy, !!h.shown.chat, !!h.shown.analysis,
    h.note && h.note.target, h.note && h.note.text].join('|');
}

async function loadHandoff(id) {
  const h = handoffState(id);
  if (h.loading) return;
  h.loading = true;
  try {
    const d = await api('/api/thread/' + id + '/handoff');
    h.chat = d && d.chat ? d.chat : null;
    h.analysis = d && d.analysis ? d.analysis : null;
    h.canLaunch = !!(d && d.canLaunch);
    h.loaded = true;
  } catch (_) {
    // An older server without the route, or a blip. No card, no noise — the rest of
    // the thread is unaffected.
    h.loaded = true;
    h.chat = null;
    h.analysis = null;
  }
  h.loading = false;
  if (state.cursor === id) { renderThread(); renderChat(); }
}
window.loadHandoff = loadHandoff;

async function openInClaudeCode(id, target) {
  const h = handoffState(id);
  const slot = h[target];
  if (!slot || h.busy) return;
  if (!h.canLaunch) { h.shown[target] = true; renderThread(); return; }
  h.busy = target;
  h.note = null;
  renderThread();
  try {
    // Not api(): every refusal here carries a sentence written for a person, and
    // api() would throw it away and say "HTTP 503".
    const res = await apiFetch('/api/thread/' + id + '/handoff', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ target: target }),
    });
    if (res.status === 401) { handleAuthFailure(); throw new Error('unauthorized'); }
    let out = null;
    try { out = await res.json(); } catch (_) { out = null; }
    if (!res.ok) throw new Error((out && (out.message || out.error)) || 'HTTP ' + res.status);
    h.note = { target: target, tone: 'good',
      text: 'Opened ' + ((out && out.terminal) || 'Terminal') + ' — Claude is picking up where it left off.' };
  } catch (err) {
    // Never a dead end: fall back to the command the user can run themselves.
    h.shown[target] = true;
    h.note = { target: target, tone: 'bad',
      text: (err && err.message ? err.message : 'Could not open a terminal.') + ' Run this yourself instead:' };
  }
  h.busy = null;
  renderThread();
}

/** A `.cmdrow` identical to the setup banner's: click-to-select command + Copy. */
function commandRow(cmd) {
  const row = el('div', 'cmdrow');
  row.appendChild(el('span', 'lead', 'Open Terminal and run:'));
  const cmdNode = el('code', 'cmd', cmd);
  cmdNode.title = 'click to select, then copy';
  row.appendChild(cmdNode);
  const copy = el('button', 'copybtn', 'Copy');
  copy.title = 'copy this command';
  copy.addEventListener('click', () => copyCommand(cmd, copy, cmdNode));
  row.appendChild(copy);
  return row;
}

async function setStatus(id, status) {
  const it = itemById(id);
  if (it) it.status = status;
  state.overrides.set(id, { status, at: Date.now() });
  renderFeed(); renderThread(); renderTitleBadge();
  try {
    await api('/api/thread/' + id + '/status', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ status }),
    });
  } catch (_) { /* the next poll reconciles */ }
  loadFeed();
}

function advanceCursor(delta) {
  const { flat } = visibleItems();
  if (!flat.length) return;
  const i = flat.findIndex((x) => x.id === state.cursor);
  const next = Math.min(flat.length - 1, Math.max(0, (i < 0 ? 0 : i) + delta));
  if (flat[next] && flat[next].id !== state.cursor) setCursor(flat[next].id, {});
  else scrollCursorIntoView();
}

function markDoneAndAdvance(id) {
  const { flat } = visibleItems();
  const i = flat.findIndex((x) => x.id === id);
  const next = flat[i + 1] || flat[i - 1] || null;
  setStatus(id, 'done');
  if (state.tab === 'inbox' && next) setCursor(next.id, {});
}

function openInSlack(id) {
  const it = itemById(id);
  const url = it && httpUrlOrNull(it.permalink);
  if (!url) { flashStrip("This conversation has no link back to Slack — open it in Slack yourself."); return; }
  window.open(url, '_blank', 'noopener,noreferrer');
}

let stripFlash = null;
function flashStrip(msg, tone) {
  stripFlash = { msg: msg, tone: tone || 'warn' };
  renderStrip();
  clearTimeout(flashStrip._t);
  flashStrip._t = setTimeout(() => { stripFlash = null; renderStrip(); }, 4000);
}
